<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI sandbox · Survive The Night</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070505'/%3E%3Cpath fill='%23c1121f' d='M16 3C16 3 8 13.5 8 19a8 8 0 0 0 16 0C24 13.5 16 3 16 3Z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&family=Share+Tech+Mono&family=Special+Elite&display=swap"
    />
    <link rel="stylesheet" href="../ui/ui.css" />
    <link rel="stylesheet" href="../ui/ui2.css" />
    <link rel="stylesheet" href="../ui/cards.css" />
    <style>
      #game {
        background: #0a0c0b;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .sky {
        position: absolute;
        inset: 0;
      }
      .trees {
        position: absolute;
        left: -2%;
        right: -2%;
        bottom: 0;
        background-repeat: repeat-x;
        background-position: bottom;
      }
      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 30%;
      }
      .sb-fire {
        position: absolute;
        left: 50%;
        bottom: 17%;
        width: 26vmin;
        height: 26vmin;
        transform: translateX(-50%);
        background: radial-gradient(circle, rgba(255, 170, 60, 0.9), rgba(255, 90, 20, 0.35) 22%, rgba(120, 40, 10, 0.1) 50%, transparent 70%);
        animation: fl 0.18s infinite alternate;
      }
      @keyframes fl {
        to {
          opacity: 0.85;
          transform: translateX(-50%) scale(1.04);
        }
      }
      .gallery {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: auto;
        padding: 24px;
        background: #121010;
        color: #e6dfcf;
        font: 12px 'Share Tech Mono', monospace;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        align-content: start;
      }
      .gallery div {
        background: #1d1a18;
        border: 1px solid #332e2a;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .gallery .ico {
        height: 40px;
        width: auto;
        max-width: 130px;
      }
      .gallery h2 {
        grid-column: 1 / -1;
        margin: 10px 0 0;
        font: 22px 'Bebas Neue', sans-serif;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="./ui-test.js"></script>
  </body>
</html>
